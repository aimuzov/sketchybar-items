name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: lua on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Reuse verified CI
        id: verified
        uses: aimuzov/infra-ci/reuse-check@v1
        continue-on-error: true
        with:
          workflow: .github/workflows/ci.yml
          matrix: ${{ toJSON(matrix) }}
      - uses: actions/checkout@v5
        if: steps.verified.outputs.reused != 'true'

      - name: Install lua
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y lua5.4
            sudo ln -sf "$(command -v lua5.4)" /usr/local/bin/lua
            sudo ln -sf "$(command -v luac5.4)" /usr/local/bin/luac
          else
            brew install lua
          fi
        if: steps.verified.outputs.reused != 'true'

      - name: Report the version under test
        run: lua -v
        if: steps.verified.outputs.reused != 'true'

      - name: Check the syntax of every file
        run: find . -name '*.lua' -exec luac -p {} +
        if: steps.verified.outputs.reused != 'true'

      # sketchybar and every tool the items watch are stubbed, so nothing is installed here
      - name: Run the tests
        run: lua tests/run.lua
        if: steps.verified.outputs.reused != 'true'
      - name: Record verified CI
        if: github.event_name == 'pull_request' && steps.verified.outputs.reused != 'true'
        uses: aimuzov/infra-ci/record-check@v1
        continue-on-error: true
        with:
          workflow: .github/workflows/ci.yml
          matrix: ${{ toJSON(matrix) }}
permissions:
  contents: read
  actions: read
  id-token: write
